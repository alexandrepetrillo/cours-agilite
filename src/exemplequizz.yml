# Exemple de Quiz - Format YAML
# Utilisez ce fichier comme modèle pour créer vos propres quiz

title: "Quiz Culture Générale - Exemple"
description: "Un quiz d'exemple pour tester l'import"

questions:
  # Question QCM (Choix Multiple)
  - text: "Quelle est la capitale de la France ?"
    type: QCM
    timeLimit: 20
    points: 1000
    answers:
      - Paris
      - Lyon
      - Marseille
      - Toulouse
    correctAnswer: 0  # Index de la bonne réponse (0 = Paris)

  # Question Vrai/Faux
  - text: "Le soleil se lève à l'ouest."
    type: VRAI_FAUX
    timeLimit: 15
    points: 500
    correctAnswer: false

  # Question Réponse Courte
  - text: "Quel est le plus grand océan du monde ?"
    type: REPONSE_COURTE
    timeLimit: 30
    points: 1000
    acceptedAnswers:
      - Pacifique
      - océan Pacifique
      - l'océan Pacifique
      - pacifique

  # Question Curseur (Slider)
  - text: "En quelle année l'homme a-t-il marché sur la Lune pour la première fois ?"
    type: CURSEUR
    timeLimit: 30
    points: 1500
    sliderMin: 1950
    sliderMax: 2000
    correctValue: 1969

  # Autre QCM
  - text: "Combien de continents y a-t-il sur Terre ?"
    type: QCM
    timeLimit: 20
    points: 800
    answers:
      - "5"
      - "6"
      - "7"
      - "8"
    correctAnswer: 2  # Index 2 = "7"

  # Autre Vrai/Faux
  - text: "La Grande Muraille de Chine est visible depuis l'espace."
    type: VRAI_FAUX
    timeLimit: 15
    points: 1000
    correctAnswer: false